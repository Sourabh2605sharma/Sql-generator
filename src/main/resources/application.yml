server:
  port: 8080

spring:
  application:
    name: sql-ai-generator

  datasource:
    url: jdbc:postgresql://localhost:5432/sql_ai_generator
    username: postgres
    password: Admin@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

openrouter:
  api-key: ${OPENROUTER_API_KEY}
  base-url: https://openrouter.ai/api/v1
  model: qwen/qwen3-32b